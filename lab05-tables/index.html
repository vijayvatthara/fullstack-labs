<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>HTML Tables Example</title>
</head>
<body>
    <h2>HTML Table Example</h2>
    <table border="1">
        <tr>
            <th rowspan="2">Category</th>
            <th colspan="2">Details</th>
        </tr>
        <tr>
            <th>Name</th>
            <th>Value</th>
        </tr>
        <tr>
            <td rowspan="2">Fruit</td>
            <td>Apple</td>
            <td>Red</td>
        </tr>
        <tr>
            <td>Banana</td>
            <td>Yellow</td>
        </tr>
        <tr>
            <td>Vegetable</td>
            <td>Carrot</td>
            <td>Orange</td>
        </tr>
    </table>
</body>
</html>
