<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Denomination Breakdown</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            width: min(550px, 90%);
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        button {
            margin-top: 15px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: left;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Bank Denomination Breakdown</h1>

        <p>
            Calculate the denomination of a deposited amount
            using ₹100, ₹50, ₹20, ₹10, ₹5, ₹2 and ₹1.
        </p>

        <button onclick="calculateDenominations()">
            Enter Amount
        </button>

        <div id="result">
            Result will appear here.
        </div>
    </div>

    <script>
        function calculateDenominations() {
            let amount = parseInt(
                prompt("Enter the amount deposited in Rs:")
            );

            if (isNaN(amount) || amount < 0) {
                document.getElementById("result").textContent =
                    "Please enter a valid amount.";
                return;
            }

            const denominations = [100, 50, 20, 10, 5, 2, 1];

            let result = "";

            for (let i = 0; i < denominations.length; i++) {
                let count = Math.floor(amount / denominations[i]);

                if (count > 0) {
                    result += `${count} - ${denominations[i]}'s<br>`;
                }

                amount %= denominations[i];
            }

            document.getElementById("result").innerHTML = result;
        }
    </script>

</body>
</html>
