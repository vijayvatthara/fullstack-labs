<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lab 06 - Student Registration Form</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <h1>Student Registration Form</h1>

        <form>

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>

                <input
                    type="date"
                    id="dob"
                    name="dob"
                    required
                >
            </div>

            <fieldset>

                <legend>Gender</legend>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="male"
                        required
                    >
                    Male
                </label>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="female"
                    >
                    Female
                </label>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="other"
                    >
                    Other
                </label>

            </fieldset>

            <div class="form-group">

                <label for="department">Department</label>

                <select
                    id="department"
                    name="department"
                    required
                >

                    <option value="">Select Department</option>

                    <option value="it">
                        Information Technology
                    </option>

                    <option value="cse">
                        Computer Science Engineering
                    </option>

                    <option value="ece">
                        Electronics and Communication
                    </option>

                    <option value="eee">
                        Electrical and Electronics
                    </option>

                </select>

            </div>

            <fieldset>

                <legend>Skills</legend>

                <label>
                    <input
                        type="checkbox"
                        name="skills"
                        value="html"
                    >
                    HTML
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="skills"
                        value="css"
                    >
                    CSS
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="skills"
                        value="javascript"
                    >
                    JavaScript
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="skills"
                        value="java"
                    >
                    Java
                </label>

            </fieldset>

            <div class="form-group">

                <label for="address">Address</label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your address"
                ></textarea>

            </div>

            <div class="buttons">

                <button type="submit">
                    Register
                </button>

                <button type="reset">
                    Reset
                </button>

            </div>

        </form>

    </main>

</body>

</html>
